# lefthook.yml
# Lefthook configuration for dotfiles
# Docs: https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md
output:
  - failure # Only show failed steps
  - execution_out # Show command output for failures

# Beads commands invoke .beads/hooks/* directly rather than a local wrapper.
# Those shims are generated by beads and fenced with its own managed markers;
# they already handle a missing `bd`, the BEADS_HOOK_TIMEOUT watchdog with its
# perl fallback, exit 124/142 for a timeout, and exit 3 for an uninitialized
# database. A local copy would drift when beads updates its own.
#
# `core.hooksPath` must stay unset. Both `bd init` and `bd hooks install
# --beads` set it to .beads/hooks, which makes git bypass lefthook entirely and
# silently -- no commitlint, no formatters. If a beads command sets it, unset it
# and re-run `lefthook install -f`.

pre-commit:
  parallel: true
  commands:
    # Lint shell scripts. `install` has no extension, so it needs naming.
    shellcheck:
      glob: '{*.sh,install}'
      run: shellcheck {staged_files}
    # shellcheck has no zsh mode, so these get a syntax check instead. zsh
    # abandons the rest of a file after a parse error, silently dropping the
    # PATH and tool setup below it. One file per call: `zsh -n a b` parses only
    # a, passing b to it as an argument.
    zsh-syntax:
      glob: 'home/dot_z*'
      run: for f in {staged_files}; do zsh -n "$f" || exit 1; done
    # Lint Markdown files
    lint-md:
      glob: '*.md'
      run: pnpm markdownlint-cli2 --fix {staged_files}
      stage_fixed: true
    # Format JSON, YAML, and Markdown files
    prettier:
      glob: '*.{ts,tsx,js,jsx,cjs,mjs,json,yaml,yml,md,mdx}'
      run: pnpm exec prettier -uwl {staged_files}
      stage_fixed: true
    beads:
      env:
        TERM: dumb
      run: .beads/hooks/pre-commit

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit "$1"

prepare-commit-msg:
  commands:
    beads:
      env:
        TERM: dumb
      # {0} forwards exactly what git passed. Git supplies the source argument
      # (message, template, merge, squash) but not the sha on a non-amend
      # commit, and lefthook renders an unfilled positional as its literal text
      # -- `{1} {2} {3}` yields a third argument of "{3}".
      run: .beads/hooks/prepare-commit-msg {0}

post-merge:
  commands:
    beads:
      env:
        TERM: dumb
      run: .beads/hooks/post-merge {1}

post-checkout:
  commands:
    beads:
      env:
        TERM: dumb
      run: .beads/hooks/post-checkout {1} {2} {3}

pre-push:
  parallel: true
  commands:
    beads:
      env:
        TERM: dumb
      run: .beads/hooks/pre-push {1} {2}
