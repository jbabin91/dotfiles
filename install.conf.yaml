- defaults:
    link:
      glob: true
      create: true
      relink: true
      force: true
    shell:
      # Without these, dotbot echoes the whole command and swallows its output.
      quiet: true
      stdout: true
      stderr: true

- clean:
    ~/:
    ~/.config:
      recursive: true

- shell:
    - [
        'src="config/karabiner/karabiner.json"; dest="$HOME/.config/karabiner/karabiner.json"; if [
        -f "$dest" ] && [ ! -L "$dest" ]; then cp "$dest" "$src" && echo "  karabiner: live →
        dotfiles"; elif [ -f "$src" ]; then mkdir -p "$(dirname "$dest")" && cp "$src" "$dest" &&
        echo "  karabiner: dotfiles → live (bootstrap)"; fi',
        Syncing karabiner config,
      ]

- link:
    # Most targets below hold state a tool rewrites -- lazy-lock.json, a theme
    # the kitten swaps, whatever `mise use` edits, zellij's regeneration on
    # upgrade -- even where most of the tree is hand-written. The symlink
    # carries those writes back into the repo for git to see; under chezmoi
    # they would strand in ~ and fail `chezmoi verify`, which ./install treats
    # as fatal. tmux stays for another reason: `tpack install` below reads the
    # deployed ~/.config/tmux/tmux.conf, and dotbot's shell section runs before
    # chezmoi deploys anything.
    ~/Brewfile: general/Brewfile
    ~/.cspell.json: general/.cspell.json
    ~/.cspell/personal-words.txt: general/.cspell/personal-words.txt
    ~/.cspell/misc.txt: general/.cspell/misc.txt
    # Global agent instructions, shared by Claude Code (~/.claude/CLAUDE.md imports
    # ~/AGENTS.md) and Codex. Named AGENTS.global.md so agents working in this repo
    # don't load it as general/agents/'s own project instructions.
    ~/AGENTS.md: general/agents/AGENTS.global.md
    ~/.codex/AGENTS.md: general/agents/AGENTS.global.md
    # Reference docs linked from it. Only docs/: ~/.agents/skills is managed by
    # the skills installer.
    ~/.agents/docs: general/agents/docs
    ~/.config/kitty: config/kitty
    # Karabiner - managed via shell sync (app replaces symlinks)
    ~/.config/mise: config/mise
    ~/.config/tmux: config/tmux
    ~/.config/btop: config/btop
    ~/.config/nvim: config/nvim
    # Zellij regenerates config.kdl on upgrade; the layouts it never touches
    # are chezmoi-managed under home/dot_config/zellij/
    ~/.config/zellij/config.kdl: config/zellij/config.kdl
    # Zed - config files only; conversations/embeddings/themes stay local
    ~/.config/zed/settings.json: config/zed/settings.json
    ~/.config/zed/keymap.json: config/zed/keymap.json
    ~/.config/zed/tasks.json: config/zed/tasks.json

# Claude Code reads ~/AGENTS.md only through an import in ~/.claude/CLAUDE.md
# (there is no user-level AGENTS.md lookup).
- shell:
    - command: sh general/agents/seed-claude-md.sh
      description: Seeding ~/.claude/CLAUDE.md

# Placed after link: so a network failure here cannot stop the symlinks. mise
# installs itself (https://mise.run) into ~/.local/bin rather than coming from
# the Brewfile, so it can self-update; SKIP_IF_EXISTS makes the re-run a no-op
# once the installed binary matches the release. Every step of that download is
# checked because each failure mode exits 0 on its own: piped into sh a failed
# fetch reports success, curl -f accepts a 2xx body that is empty or not a
# script, and sh runs both without complaint. mise is then called by absolute
# path, since the shell running ./install predates the .zshenv that puts
# ~/.local/bin on PATH. `quiet` suppresses the descriptions below, so each
# message names mise itself; stdout is off per entry to hide brew's ~170 lines.
- shell:
    - command: brew bundle --file=general/Brewfile --no-upgrade
      description: Installing Homebrew packages
      stdout: false
    - command: >
        set -e;
        t=$(mktemp);
        trap 'rm -f "$t"; true' EXIT;
        curl -fsSL https://mise.run -o "$t";
        head -n1 "$t" | grep -q '^#!' ||
        { echo "  mise: https://mise.run returned $(wc -c <"$t" | tr -d " ") bytes that are not a script" >&2; exit 1; };
        MISE_INSTALL_SKIP_IF_EXISTS=1 MISE_QUIET=1 sh "$t" ||
        { s=$?; echo "  mise: installer exited $s (over 128 means killed by signal)" >&2; exit "$s"; };
        [ -s "$HOME/.local/bin/mise" ] ||
        { echo "  mise: installer exited 0 but left nothing at ~/.local/bin/mise" >&2; exit 1; }
      description: Installing mise
      stdout: false
    # -s, not -x: a truncated install leaves an empty file that is still
    # executable and still exits 0 on every invocation.
    - command: >
        m="$HOME/.local/bin/mise";
        if [ ! -s "$m" ] || ! "$m" --version >/dev/null 2>&1; then
        echo "  mise: $m is missing or will not run, so the install step above left no working binary" >&2;
        exit 1; fi;
        "$m" install
      description: Installing mise tools
      stdout: false
    # Runs after brew, which provides tpack. Reads the @plugin lines from
    # tmux.conf and clones anything missing; a no-op once they are present.
    - command: command -v tpack >/dev/null && tpack install || true
      description: Installing tmux plugins
    # tmux-which-key has no option for a config path (its XDG mode calls GNU
    # `realpath --relative-to`, which BSD realpath rejects), so link the menu
    # config into the plugin directory, whose name carries a content hash.
    - [
        'd=$(echo "$HOME"/.local/share/tmux/plugins/tmux-which-key-*); if [ -d "$d" ]; then ln -sfn
        "$PWD/config/tmux/plugins/tmux-which-key/config.yaml" "$d/config.yaml" && echo "
        tmux-which-key: menu config linked"; fi',
        Linking tmux-which-key config,
      ]
