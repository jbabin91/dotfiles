[tools]
dotnet = "10.0.403"
gitleaks = "8.30.1"
node = "lts"
pnpm = "12.16.1"
# Pinned rather than the "stable" channel so the toolchain is deterministic;
# bump deliberately. This does NOT avoid mise's rustup round trips -- measured,
# the symlink backend still shells out to `rustup show profile` and
# `rustup component list` either way.
rust = "1.99.1"

# No Homebrew formula; declared here (not Brewfile's `cargo`) so mise resolves the
# rust toolchain first. linesmith is absent — it's installed locally via
# `cargo install --path`, making the working tree the source of truth.
"cargo:cargo-interactive-update" = "0.6.2"

"npm:@obsfx/trekker" = "1.12.0"
"npm:@tanstack/intent" = "0.5.6"
"npm:czg" = "1.14.0"
"cargo:knope" = "0.23.2"
"npm:pyright" = "1.1.414"
"npm:typescript" = "7.0.2"

[tool_alias]
# The npm backend skips pnpm 12's install script, leaving a placeholder launcher
# that crashes under node; the aqua backend installs the native binary.
pnpm = "aqua:pnpm/pnpm"

[env]
# Turborepo's own opt-out. DO_NOT_TRACK would also turn off Claude Code's
# feature-flag fetch.
TURBO_TELEMETRY_DISABLED = "1"

[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm"]
self_update.auto = true
