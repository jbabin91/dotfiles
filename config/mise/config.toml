[tools]
dotnet = "10.0.400"
gitleaks = "8.30.1"
node = "lts"
pnpm = "11.24.0"
rust = "stable"

# No Homebrew formula; declared here (not Brewfile's `cargo`) so mise resolves the
# rust toolchain first. linesmith is absent — it's installed locally via
# `cargo install --path`, making the working tree the source of truth.
"cargo:cargo-interactive-update" = "0.6.2"

"npm:@obsfx/trekker" = "1.11.0"
"npm:@opencode-ai/cli" = "0.0.0-beta-17498"
"npm:@tanstack/intent" = "0.3.7"
"npm:czg" = "1.14.0"
"cargo:knope" = "0.23.0"

[settings]
idiomatic_version_file_enable_tools = ["node"]
auto_update = true
