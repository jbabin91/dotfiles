# Terminal ------------------------------------------------------------------

# tmux 3.7 already defaults to tmux-256color; set explicitly so the config also
# behaves on older tmux builds.
set -g default-terminal "tmux-256color"

# terminal-features is the supported way to declare capabilities terminfo does
# not report; tmux auto-detects RGB/clipboard/focus for Ghostty and Kitty, but
# not styled underlines or OSC 8 hyperlinks.
set -as terminal-features ",*:usstyle"
set -as terminal-features ",*:hyperlinks"
# Ghostty speaks the extended-key protocol but does not advertise it via
# terminfo. Without this, Shift+Enter is indistinguishable from Enter inside
# tmux, so apps like Claude Code cannot bind it.
set -as terminal-features ",*:extkeys"

# `on`, not `always`: always forces mode 1, which only rewrites keys lacking a
# well-known representation, and Enter has one. Mode 2, which apps request for
# themselves, is what makes Shift+Enter distinguishable.
set -s extended-keys on
# csi-u, not the xterm default: Claude Code, Codex and Pi expect the kitty
# protocol encoding (^[[13;2u) that Ghostty sends natively, not xterm's
# ^[[27;2;13~. Without this tmux re-encodes the key into a form they ignore.
set -s extended-keys-format csi-u

set -g focus-events on
# Let escape sequences from nested programs (image protocols, progress bars)
# reach the outer terminal.
setw -g allow-passthrough on
# OSC 52, so copying reaches the system clipboard over SSH as well as locally.
set -s set-clipboard on

# no-detached, not off: killing a session switches to a session that is sitting
# detached, but detaches the client when every remaining session is attached
# elsewhere -- so exiting in one terminal never hijacks another terminal's
# session. Plain `off` switches regardless and causes two clients to mirror.
set -g detach-on-destroy no-detached

set -g history-limit 50000
set -g display-time 2000
set -sg repeat-time 400

# Windows and panes ---------------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Windows follow the running command. An explicit rename (prefix + , or a name
# sesh sets at creation) turns this off for that window only, so `agents` and
# `dev` keep their names while ad-hoc windows label themselves.
# Requires kiro-cli's pty wrapper to be disabled -- see Q_TERM in .zshenv --
# or pane_current_command reports the wrapper instead of the real process.
setw -g automatic-rename on
# The claude launcher execs a version-named binary (~/.local/share/claude/
# versions/2.1.245), so pane_current_command is the version string. Rewrite a
# bare version number back to "claude"; everything else passes through.
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{s|^[0-9][0-9.]*$|claude|:pane_current_command}}#{?pane_dead,[dead],}'
set -g set-titles on

# Prefix --------------------------------------------------------------------

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Splits and new windows inherit the current pane's directory.
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# sesh supersedes choose-tree: it lists live sessions plus zoxide directories
# that have no session yet, and creates one on connect. choose-tree stays on the
# uppercase key.
bind s run-shell ~/.config/tmux/scripts/sesh-connect.sh
bind S choose-tree -Zs

# lazygit in a popup, scoped to the current pane's repo.
bind g display-popup -E -d "#{pane_current_path}" -w 88% -h 80% lazygit

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z

# Ctrl-hjkl navigation and Alt-hjkl resizing are provided by the smart-splits
# plugin below, which reads the @pane-is-vim pane variable that smart-splits.nvim
# sets on load. Copy mode is not covered by the plugin, so bind it here.
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# Mouse and copy mode -------------------------------------------------------

set -g mouse on
setw -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

# Drag-select copies without leaving copy mode, so the selection stays visible
# and the scrollback position is kept.
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "pbcopy"

# Plugins -------------------------------------------------------------------

# Managed by tpack (brew), a maintained drop-in for TPM: prefix + T for the TUI,
# `tpack install|update|clean` from the shell. Plugins live outside the dotfiles
# repo so no nested git checkouts land in it.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"

set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'mrjones2014/smart-splits.nvim'
set -g @plugin 'alexwforsythe/tmux-which-key'

# XDG mode is not enabled: it calls `realpath --relative-to`, a GNU option that
# BSD realpath on macOS rejects, so the plugin fails to load. config.yaml
# therefore lives in the plugin directory. Binds prefix + Space, replacing the
# default next-layout.

# Ctrl-hjkl moves, Alt-hjkl resizes; both cross the nvim/tmux boundary.
set -g @smart-splits_resize_step_size '5'

# Flavor matches Ghostty and Zed.
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Save every 15 minutes and restore on server start, so a lost server is not a
# lost session. Pane contents are captured; running programs are restored by
# command name.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
# Added to resurrect's default list (vim/nvim/emacs/man/less/top/htop/...),
# which has no entry for the tools this setup actually leaves running.
# `claude` matches here even though automatic-rename-format above has to
# rewrite it: resurrect derives its own command via `pgrep -lf` on the pane's
# child, giving "claude", while tmux reports the version-named binary it
# execs. Two different fields, so the two settings disagree by design.
set -g @resurrect-processes 'claude lazygit btop'
# Restores `nvim -S` only when a Session.vim sits in the pane's directory.
# LazyVim uses persistence.nvim, which saves to stdpath("state")/sessions
# instead, so this currently falls back to opening a plain nvim.
set -g @resurrect-strategy-nvim 'session'

# Status modules resolve lazily via #{E:...}, so they can be composed before the
# theme loads. continuum prepends its save hook onto status-right when it loads,
# so the plugins must be sourced last or that hook is overwritten and continuum
# silently never saves.
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

run 'tpack init'
